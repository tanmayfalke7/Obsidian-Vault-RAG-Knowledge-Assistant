<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — {{ app_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Join {{ app_name }}</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <div class="card">
      <form action="/register" method="post">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="full_name">Full name</label>
            <input class="form-input" type="text" id="full_name" name="full_name"
                   placeholder="Jane Smith" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" name="username"
                   placeholder="jsmith" required pattern="[a-zA-Z0-9_\-]{3,}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email"
                 placeholder="jane@company.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password"
                   placeholder="Min. 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label class="form-label" for="password_confirm">Confirm password</label>
            <input class="form-input" type="password" id="password_confirm" name="password_confirm"
                   placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top:.5rem">
          Create account
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>
<script src="/static/js/app.js" defer></script>
</body>
</html>
