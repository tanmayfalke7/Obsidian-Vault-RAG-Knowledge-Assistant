{% extends "base.html" %}
{% block title %}Sign In · Vault GraphRAG{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/css/auth.css">{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-brand">
      <span class="brand-mark">VG</span>
      <h1>Sign in</h1>
      <p>Use your vault account to continue.</p>
    </div>
    <form class="auth-form" data-auth-form="login" novalidate>
      <label>Email
        <input class="input" name="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input class="input" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" data-form-error></p>
      <button class="button button-primary button-wide" type="submit">Sign in</button>
    </form>
    <p class="auth-switch">No account yet? <a href="/register">Create one</a></p>
  </section>
</main>
{% endblock %}
