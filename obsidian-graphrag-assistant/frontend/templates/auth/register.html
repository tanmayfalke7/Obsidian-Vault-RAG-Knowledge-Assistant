{% extends "base.html" %}
{% block title %}Register · Vault GraphRAG{% endblock %}
{% block styles %}<link rel="stylesheet" href="/static/css/auth.css">{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-brand">
      <span class="brand-mark">VG</span>
      <h1>Create account</h1>
      <p>Start building your private knowledge graph.</p>
    </div>
    <form class="auth-form" data-auth-form="register" novalidate>
      <label>Name
        <input class="input" name="name" autocomplete="name" required>
      </label>
      <label>Email
        <input class="input" name="email" type="email" autocomplete="email" required>
      </label>
      <label>Phone
        <input class="input" name="phone" autocomplete="tel" required>
      </label>
      <label>Password
        <input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Confirm password
        <input class="input" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <p class="form-error" data-form-error></p>
      <button class="button button-primary button-wide" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="/login">Sign in</a></p>
  </section>
</main>
{% endblock %}
